version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Only open PRs for security patches, not every version bump
    open-pull-requests-limit: 5
    labels:
      - "security"
    commit-message:
      prefix: "security"
    # Ignore non-security version bumps
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
