name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly cron so new vulnerability patterns are caught even when
  # no code has changed (njsscan updates its rule set independently).
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9 AM UTC

jobs:
  njsscan:
    name: njsscan (Node.js security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: njsscan
        uses: ajinabraham/njsscan-action@v7
        with:
          args: "src/ --config .njsscanrc"

  secrets:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: npm audit + signatures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` refuses to run if package-lock.json diverges from
      # package.json, giving us lockfile-integrity for free. The
      # `--ignore-scripts` flag blocks any install-time hooks from
      # executing — cuts off an entire class of supply-chain attack.
      - name: Install (reproducible, no postinstall scripts)
        run: npm ci --ignore-scripts

      - name: npm audit
        run: npm audit --audit-level=high

      # Verify every installed tarball's npm-registry signature. Catches
      # tampered packages that would otherwise slip past npm audit.
      # Available since npm 8.15.
      - name: Verify package signatures
        run: npm audit signatures

  dependency-review:
    name: Dependency review (PR only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      # Blocks the PR if it introduces a dependency (or new version) with
      # a known high/critical CVE or an incompatible license. Runs only
      # on PRs because the diff-vs-base comparison is the point.
      - name: Review PR dependency diff
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Deny license families that would conflict with a future
          # paid plan or closed-source distribution.
          deny-licenses: AGPL-3.0, GPL-3.0

  sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Generate CycloneDX SBOM
        # --ignore-npm-errors: optional platform-specific deps trigger
        # npm-ls warnings that aren't real problems. Don't fail the
        # whole SBOM over them.
        run: npx --yes @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-format JSON --output-file sbom.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: sbom.json
          retention-days: 90
