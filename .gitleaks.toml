# Gitleaks config — extends defaults + allowlists safe values.

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for values that match secret-shaped patterns but are public by design."

# Stripe publishable keys are public by design — they're embedded in
# every page load so the client-side Stripe.js can initialize. Only
# the matching secret key (`sk_*`) is sensitive. The default gitleaks
# rule for Stripe matches both; narrow it by exempting the `pk_` form.
regexTargets = ["match"]
regexes = [
  '''pk_(?:live|test)_[A-Za-z0-9]+''',
]
