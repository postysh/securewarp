[package]
name = "securewarp-desktop"
version = "0.1.0"
description = "SecureWarp desktop app"
authors = ["SecureWarp"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "securewarp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
